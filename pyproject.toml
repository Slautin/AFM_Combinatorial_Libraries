[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afm-lib"
version = "0.1.0"
description = "LangGraph workflows for combinatorial-library exploration on an Asylum SPM"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # graph runtime
    "langgraph",                 # graphs/, node wiring
    # instrument MCP (streamable-http)
    "langchain-mcp-adapters",    # instrument/session.py
    # file-reader MCP (stdio)
    "mcp",                       # readers/scifireaders_service.py
    # data contracts
    "pydantic",                  # schemas/
    "typing-extensions",         # states/ - TypedDict, NotRequired
    "pyyaml",                    # schemas/recipe.py - load_recipe
    # analysis
    "numpy",                     # loops_utils, channel_utils, io_utils
    "matplotlib",                # loop figures, channel previews
    "pillow",                    # channel_utils - preview PNGs
    "scifireaders",              # .ibw reading
    "igor2",                     # scifireaders' Igor backend - NOT transitive, declare it
    "scikit-image",
]

[project.optional-dependencies]
dev = ["ipykernel", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]